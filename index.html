(function(){

 const headings={'home-content.html':'Find Universities, Courses & Admissions in Ghana','universities.html':'Universities in Ghana','admissions.html':'University Admissions in Ghana','student-tools.html':'Student Tools for Ghanaian Students','dashboard.html':'My University Application Dashboard','dunamis.html':'The Dunamis — UniGuideGH Assistant'};

 document.querySelector('.app-brand').addEventListener('click',()=>{select(links[0]);});

 frame.addEventListener('load',()=>{try{const path=frame.contentWindow.location.pathname.split('/').pop();const match=links.find(a=>a.dataset.page===path || (path==='index.html'&&a.dataset.page==='home-content.html'));if(match)select(match);}catch(e){}});
